# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}
{% for commit in entry.commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/juanmartin/universal-dj-usb/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true

[git]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs?", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^chore|^ci|^build", group = "Build and CI" },
  { message = "^Merge", skip = true },
  { message = "^revert", group = "Reverts" },
  { message = ".*", group = "Other Changes" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/juanmartin/universal-dj-usb/pull/${1}" },
]
sort_commits = "oldest"
